<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover: iPhoneの画面の端（丸い角・下のバー）まで使う -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b5d1e">
  <!-- iPhoneのホーム画面アプリとして開いたときの設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ゴルフ上達">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
  <title>ゴルフ上達</title>
</head>
<body>
  <!-- バックアップのお知らせ（30日以上空いたとき） -->
  <div id="notice" class="notice" hidden></div>

  <main>
    <section id="tab-before" class="tab-panel" data-tab="before">
      <h1>ラウンド前</h1>
      <p class="placeholder">準備中</p>
    </section>
    <section id="tab-playing" class="tab-panel" data-tab="playing" hidden>
      <h1>ラウンド中</h1>
      <p class="placeholder">準備中</p>
    </section>
    <section id="tab-review" class="tab-panel" data-tab="review" hidden>
      <h1>振り返り</h1>
      <p class="placeholder">準備中</p>
    </section>
    <section id="tab-settings" class="tab-panel" data-tab="settings" hidden>
      <h1>設定</h1>
      <div id="settings-root"></div>
    </section>
  </main>

  <!-- 画面下のタブ -->
  <nav class="tab-bar" aria-label="モードの切り替え">
    <button type="button" class="tab-button" data-tab="before" aria-current="page">ラウンド前</button>
    <button type="button" class="tab-button" data-tab="playing">ラウンド中</button>
    <button type="button" class="tab-button" data-tab="review">振り返り</button>
    <button type="button" class="tab-button" data-tab="settings">設定</button>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
