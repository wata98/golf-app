<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <!-- 安全のための決まり（Content Security Policy）: このサイト自身のファイルだけを動かす。
       通信してよい先 = 楽天GORAのAPI（空き確認）、画像を読んでよい先 = 国土地理院の地図。
       'wasm-unsafe-eval' は骨格推定（MediaPipe）の計算部品を動かすのに必要。
       外部のサービスを足すときは、ここにも足す（docs/保守ガイド.md）。 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://cyberjapandata.gsi.go.jp; connect-src 'self' https://openapi.rakuten.co.jp; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'">
  <!-- viewport-fit=cover: iPhoneの画面の端（丸い角・下のバー）まで使う -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b5d1e">
  <!-- iPhoneのホーム画面アプリとして開いたときの設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ゴルフ上達">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
  <title>ゴルフ上達</title>
</head>
<body>
  <!-- バックアップのお知らせ（30日以上空いたとき） -->
  <div id="notice" class="notice" hidden></div>

  <main>
    <section id="tab-before" class="tab-panel" data-tab="before">
      <h1>ラウンド前</h1>
      <div id="before-root"></div>
    </section>
    <section id="tab-playing" class="tab-panel" data-tab="playing" hidden>
      <div id="round-root"></div>
    </section>
    <section id="tab-review" class="tab-panel" data-tab="review" hidden>
      <h1>振り返り</h1>
      <div id="review-root"></div>
    </section>
    <section id="tab-settings" class="tab-panel" data-tab="settings" hidden>
      <h1>設定</h1>
      <div id="settings-root"></div>
    </section>
  </main>

  <!-- 画面下のタブ -->
  <nav class="tab-bar" aria-label="モードの切り替え">
    <button type="button" class="tab-button" data-tab="before" aria-current="page">ラウンド前</button>
    <button type="button" class="tab-button" data-tab="playing">ラウンド中</button>
    <button type="button" class="tab-button" data-tab="review">振り返り</button>
    <button type="button" class="tab-button" data-tab="settings">設定</button>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
